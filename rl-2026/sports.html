<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<title>Montreal’s highest-paid sports stars 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,200..800&display=swap" rel="stylesheet">
<style>
/* ------------------------------------------------------------------
   House style: black serif type on white.
   Newsreader is the web stand-in; swap the font-family below for the
   house faces if they are available to embeds.
------------------------------------------------------------------- */
:root{
  --grade:saturate(.78) contrast(1.06) brightness(1.02) sepia(.07);
  --wash:rgba(238, 224, 204, .22);
  --font:"Newsreader","Tiempos Text",Georgia,"Times New Roman",serif;
  --bg:#ffffff;
  --ink:#111111;
  --ink-2:#333333;
  --muted:#6b6b6b;
  --hair:#e4e4e4;
  --hair-2:#cdcdcd;
  --face-bg:#e8e8e8;
  --face-ink:#4a4a4a;
  --focus:#111111;
  --intro-h:680px;      /* opening screen: same height at every width */
  color-scheme:only light;
}
 
html,body{margin:0;background:var(--bg);}
*{box-sizing:border-box;}
.rl{
  max-width:760px;margin:0 auto;padding:0 16px 24px;
  font-family:var(--font);font-optical-sizing:auto;
  font-size:20px;line-height:1.45;color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
.rl [hidden]{display:none !important;}
.rl :focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:2px;}
 
/* Opening screen: question, picture, link. It is a fixed height at every width;
   the picture takes whatever room the question leaves, so a question that wraps
   onto more lines on a phone shrinks the picture instead of pushing the list down. */
.rl-intro{--gap:32px;display:flex;flex-direction:column;height:var(--intro-h);padding:28px 0 calc(var(--gap) - 4px);}
.rl-intro.noflick{height:auto;}
.rl-title{
  flex:none;margin:0 0 var(--gap);font-weight:400;letter-spacing:-.01em;line-height:1.08;
  font-size:clamp(1.6rem,5.2vw,2.3rem);
}
@media (max-width:639px){
  .rl-intro{--gap:26px;padding-top:24px;}
  .rl-title{font-size:clamp(2rem,8.2vw,2.4rem);}
}
.rl-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;}
/* All questions share one grid cell, so the block is always as tall as the longest
   question and nothing below it jumps when the question changes. */
.rl-rot{display:grid;align-items:end;}
.rl-rot .q{grid-area:1 / 1;visibility:hidden;}
.rl-rot .q.on,.rl-rot .q.out{visibility:visible;}
.rl-rot .w{
  display:inline-block;opacity:0;transform:translateY(.38em);filter:blur(3px);
  transition:opacity .5s ease,transform .6s cubic-bezier(.2,.75,.25,1),filter .5s ease;
  transition-delay:calc(var(--i) * 40ms);
}
.rl-rot .q.on .w{opacity:1;transform:none;filter:none;}
.rl-rot .q.out .w{
  opacity:0;transform:translateY(-.22em);filter:blur(2px);
  transition-duration:.32s;transition-delay:calc(var(--i) * 12ms);
}
@media (prefers-reduced-motion:reduce){ .rl-rot .w{transition:none !important;filter:none !important;transform:none !important;} }
 
/* Flickering photos: fill the space left in the opening screen (landscape on wide
   screens, portrait on phones). Same light grade and warm wash as the circles. */
.rl-flick{position:relative;margin:0;flex:1 1 0;min-height:0;overflow:hidden;background:#33312f;}
.rl-flick .fr{position:absolute;inset:0;margin:0;display:none;}
.rl-flick .fr.on{display:block;}
.rl-flick .fr.dark{background:#33312f;}
.rl-flick .fr.light{background:#e7e7e3;}
.rl-flick .fr img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block;filter:var(--grade);}
.rl-flick .fr::after{content:"";position:absolute;inset:0;background:var(--wash);mix-blend-mode:multiply;pointer-events:none;}
.rl-flick figcaption{position:absolute;left:12px;bottom:12px;z-index:1;max-width:calc(100% - 24px);padding:4px 10px 5px;font-size:15px;line-height:1.3;font-weight:600;}
.rl-flick figcaption span{font-weight:400;opacity:.75;margin-right:6px;font-variant-numeric:lining-nums;}
.rl-flick .fr.dark figcaption{color:#111;background:#f2f0ec;}
.rl-flick .fr.light figcaption{color:#f2f0ec;background:#111;}
.rl .rl-jump{
  flex:none;align-self:center;display:inline-flex;align-items:center;gap:6px;margin-top:calc(var(--gap) - 4px);padding:4px 2px;
  border:0;background:none;cursor:pointer;font:inherit;font-size:17px;font-weight:500;color:var(--ink);
  text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:5px;
}
.rl .rl-jump svg{flex:none;transform:translateY(1px);}
.rl .rl-jump:hover{text-decoration-thickness:2px;}
 
/* List */
.rl-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink);scroll-margin-top:0;}
/* Each profile. Phones: rank, name and pay on top, then the photo, then the details.
   Wider screens: details take two thirds, pay and photo sit centred in the last third. */
.rl-item{
  --rk:2.9rem;
  display:grid;grid-template-columns:minmax(0,1fr) auto;
  grid-template-areas:"head val" "pic pic" "body body";
  column-gap:12px;padding:18px 2px 20px;border-bottom:1px solid var(--hair);
  scroll-margin-top:12px;
}
.rl-txt,.rl-side{display:contents;}
.rl-head{grid-area:head;display:grid;grid-template-columns:var(--rk) minmax(0,1fr);column-gap:10px;align-items:start;}
.rl-rank{font-weight:300;font-size:30px;line-height:1.05;color:var(--ink);font-variant-numeric:lining-nums tabular-nums;}
.rl-mv{display:flex;align-items:center;gap:3px;margin-top:5px;font-size:13.5px;color:var(--muted);font-variant-numeric:lining-nums tabular-nums;white-space:nowrap;}
.rl-mv .dash{font-weight:800;color:var(--ink);}
.rl-new{font-size:11.5px;font-weight:600;padding:0 6px;border-radius:999px;border:1px solid var(--ink);color:var(--ink);}
.rl-who{min-width:0;}
.rl-name{display:block;margin:0;font-weight:400;font-size:max(22px, calc(var(--pfs, 19px) * 1.08));line-height:1.2;text-wrap:balance;}
.rl-co{display:block;font-size:16px;color:var(--muted);line-height:1.3;margin-top:2px;}
.rl-val{grid-area:val;font-weight:700;font-size:22px;line-height:1.2;font-variant-numeric:lining-nums;white-space:nowrap;text-align:right;}
/* Portraits: one, two or three circles. Groups overlap slightly, each circle kept
   apart by a thin white ring. */
.rl-pics{
  grid-area:pic;justify-self:center;margin:14px 0 0;
  display:flex;justify-content:center;align-items:center;
  --d:clamp(84px, 24vw, 104px);
}
.rl-pics.n2{--d:clamp(76px, 21vw, 94px);}
.rl-pics.n3{--d:clamp(66px, 18vw, 84px);}
.rl-pic{
  position:relative;flex:none;width:var(--d);height:var(--d);border-radius:50%;overflow:hidden;
  background:var(--bg);box-shadow:0 0 0 3px var(--bg),0 0 0 4px var(--hair-2);
  display:grid;place-items:center;
}
.rl-pic + .rl-pic{margin-left:calc(var(--d) * -.12);}
.rl-pic.init{background:var(--face-bg);}
.rl-pic img{width:100%;height:100%;object-fit:cover;display:block;filter:var(--grade);}
.rl-pic:not(.init)::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--wash);mix-blend-mode:multiply;pointer-events:none;}
.rl-pic span{font-weight:600;font-size:calc(var(--d) * .3);color:var(--face-ink);letter-spacing:.02em;}
.rl-body{grid-area:body;padding:14px 0 0;min-width:0;}     /* phones: full width, under the rank */
/* Profile text. --pfs is set by the script so the whole embed keeps the same height
   at every screen width (see CONFIG.height); 19px is the size used without it.
   Names grow with it so they always stay a step larger than the text. */
.rl-body p{margin:0 0 12px;max-width:60ch;font-size:var(--pfs, 19px);line-height:1.42;}
.rl-body p:last-child{margin-bottom:0;}
@media (min-width:520px){
  .rl-item{--rk:2.4rem;grid-template-columns:minmax(0,2fr) minmax(0,1fr);grid-template-areas:none;column-gap:28px;padding:22px 4px 24px;}
  .rl-txt{display:block;}
  .rl-side{display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:2px;}
  .rl-rank{font-size:26px;}
  .rl-mv{font-size:12.5px;}
  .rl-name{font-size:max(20px, calc(var(--pfs, 19px) * 1.1));line-height:1.25;}
  .rl-co{font-size:15.5px;line-height:1.35;}
  .rl-val{font-size:24px;text-align:center;}
  .rl-pics{margin:0;justify-self:auto;--d:clamp(88px, 13vw, 112px);}
  .rl-pics.n2{--d:clamp(72px, 10.5vw, 92px);}
  .rl-pics.n3{--d:clamp(60px, 9vw, 76px);}
  .rl-body{padding:16px 0 0 calc(var(--rk) + 10px);}
  .rl-body p{margin-bottom:14px;line-height:1.55;}     /* longer lines, a little more air */
}
@media (min-width:520px) and (max-width:639px){        /* narrow two-column: text runs under the rank */
  .rl-item{column-gap:22px;}
  .rl-body{padding-left:0;}
  .rl-body p{line-height:1.48;}
}
 
/* Notes */
.rl-notes{margin-top:22px;font-size:14.5px;color:var(--muted);}
.rl-notes p{margin:0 0 8px;}
.rl-notes strong{color:var(--ink-2);font-weight:600;}
</style>
</head>
<body>
<main class="rl" id="rl">
  <header class="rl-intro" id="rl-intro">
    <h2 class="rl-title" id="rl-title"><span class="rl-sr" id="rl-title-sr"></span><span class="rl-rot" id="rl-rot" aria-hidden="true"></span></h2>
    <div class="rl-flick" id="rl-flick" aria-hidden="true"></div>
    <button type="button" class="rl-jump" id="rl-jump">Read the full profiles<svg width="11" height="15" viewBox="0 0 11 15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 1v12.5M1.5 9.5l4 4 4-4"/></svg></button>
  </header>
  <ol class="rl-list" id="rl-list" aria-labelledby="rl-title"></ol>
  <footer class="rl-notes" id="rl-notes"></footer>
</main>
 
<script>
const CONFIG = {
  title: "Montreal’s highest-paid sports stars",   // read out by screen readers in place of the questions
  // The title rotates through these, one every few seconds, as on the rich list.
  questions: [
    "Who are Montreal’s highest-paid sports stars?",
    "Which Hab was called too small for the NHL?",
    "Which Montrealer plays in goal for Morocco?",
    "How many athletes make over $10 million a year?",   // 13 of the 15, in Canadian dollars
  ],
  questionSeconds: 3,
  flickerSeconds: 1.5,
  // Total height of the embed, in pixels, at every screen width. Set your iframe to the
  // same height. The profile text is sized (between the two textSize values) so that
  // everything fills exactly this much; any space left over goes at the very bottom.
  // If you add or cut a lot of text, change this number and the iframe height together.
  // Set it to 0 to let the height follow the content, as before.
  height: 7900,
  textSize: [15.5, 24],
  // Bank of Canada daily rate, Oct. 16, 2026: US$1 = C$1.4154. If you change it, change the note too,
  // and the converted amounts written into the profiles.
  usdToCad: 1.4154,
  notes: ["Salaries in Canadian dollars, converted from U.S. dollars. "],
};
 
const ATHLETES = [
  { id:"guerrero", name:"Vladimir Guerrero Jr.", initials:"VG", photos:["32.png"], big:"0327 spt col cowan - 5417.jpg", pay:35.7,
    team:"Baseball · Toronto Blue Jays",
    blurb:"Montrealers have seen the 27-year-old Blue Jays first baseman in an Expos uniform: in 2002, at the age of three, he joined his father, Expos star Vladimir Guerrero, on the diamond. His 14-year contract, worth about $708 million, averages about $50.5 million a year, though because of the way it’s structured he will actually make about $42.5 million this year, after $68.6 million last year. Like his dad, he’s known for hitting home runs, with 192 in his career, and was named an all-star for the sixth year in a row this season." },
  { id:"dort", name:"Luguentz “Lu” Dort", initials:"LD", photos:["33.png"], pay:16.5,
    team:"Basketball · Atlanta Hawks",
    blurb:"The son of Haitian immigrants, Dort grew up in Montreal North playing soccer before discovering basketball in neighbourhood parks and joining his first team, in Parc-Ex, at about 12 or 13. Known for his defence, he played for Canada at the Paris Olympics and regularly returns to Montreal North for community events. He’s earning about $23 million this season on the five-year, $123.8-million contract he signed in 2022." },
  { id:"stroll", name:"Lance Stroll", initials:"LS", photos:["34.png"], big:"0522 spt gp 8383.jpg", pay:12.75,
    team:"Formula One · Aston Martin Aramco",
    blurb:"The Montreal-born driver’s salary isn’t declared, but Aston Martin, owned by his billionaire father, Lawrence Stroll, paid £9.6 million (about $18.1 million) in 2025 for “racing services” to Golden Eagle Racing, a company he controls. Those payments may not exactly match his pay, but it’s not a bad payday for a driver who has never finished better than third in an F1 race and hasn’t reached the podium since 2020." },
  { id:"bounou", name:"Yassine “Bono” Bounou", initials:"YB", photos:["35.png"], pay:11,
    team:"Soccer · Al-Hilal",
    blurb:"Born in Montreal, Bounou moved with his parents to their native Morocco as a small child and grew up in Casablanca. He spent most of his career in Spain, most recently with Sevilla, before joining Riyadh-based Al-Hilal, and plays for Morocco internationally. His salary isn’t disclosed, so the figure is an estimate based on several sources." },
  { id:"huberdeau", name:"Jonathan Huberdeau", initials:"JH", photos:["36.png"], pay:10.5,
    team:"Hockey · Calgary Flames",
    blurb:"Raised in the St-Jérôme area, where his father owned a car dealership in Prévost, Huberdeau broke through as a teenager with the St-Eustache Vikings, leading the Quebec Midget AAA league in scoring in 2008-09. After winning the 2011 Memorial Cup with the Saint John Sea Dogs, he won the Calder Trophy with the Florida Panthers and was traded to the Calgary Flames in 2022. He hosts an annual golf tournament for Laval’s Cité-de-la-Santé hospital and is the spokesperson for Quebec ball hockey equipment maker Knapper." },
  { id:"dobson", name:"Noah Dobson", initials:"ND", photos:["37.png"], pay:9.5,
    team:"Hockey · Montreal Canadiens",
    blurb:"The Summerside, P.E.I., native won back-to-back Memorial Cups, with Acadie-Bathurst in 2018 and then with Rouyn-Noranda after a trade. Drafted by the New York Islanders in 2018, he was traded to the Habs in 2025 and is on an eight-year, $107.6-million contract. Last season, the defenceman had 12 goals and 35 assists." },
  { id:"hutson", name:"Lane Hutson", initials:"LH", photos:["38.png"], pay:8.9,
    team:"Hockey · Montreal Canadiens",
    blurb:"The Michigan-born defenceman, who grew up near Chicago, played for Boston University before making his Canadiens debut in 2024, two years after Montreal drafted him. Scouts questioned whether he was big enough for the NHL, but he won the Calder Trophy as a rookie, the Habs’ first since Ken Dryden in 1972. According to The Athletic’s Dom Luszczyszyn, his eight-year, $100.2-million deal is the best in the league for his team, as his play could be worth around $28 million a year." },
  { id:"mbilli", name:"Christian Mbilli", initials:"CM", photos:["sports.png"], pay:8.85,
    team:"Boxer",
    blurb:"Born in Cameroon and raised in France, Mbilli moved to Montreal in 2017 to turn professional. The boxer became WBC super-middleweight world champion in January and is set to face Canelo Álvarez in Saudi Arabia on Oct. 31." },
  { id:"suzuki", name:"Nick Suzuki", initials:"NS", photos:["40.png"], pay:7.875,
    team:"Hockey · Montreal Canadiens",
    blurb:"The Habs captain from London, Ont., signed his eight-year, $89.2-million deal in 2021 and has acknowledged it now pays less than contracts signed by other stars as salaries rise. Some Canadiens have accepted less than they could earn elsewhere because they want to win in Montreal, he said in August, adding that he and his teammates still earn enough to live comfortably for the rest of their lives. Off the ice, he has done ads for Bauer, Tim Hortons and Hellmann’s, among others." },
  { id:"caufield", name:"Cole Caufield", initials:"CC", photos:["41.png"], big:"0408 spt habs (7).jpg", pay:7.85,
    team:"Hockey · Montreal Canadiens",
    blurb:"Born in Mosinee, Wis., Caufield was drafted by Montreal in 2019 and won the Hobey Baker Award as U.S. college hockey’s top player at the University of Wisconsin in 2021. He made his NHL debut with the Habs that spring and joined their run to the Stanley Cup final. He earns an average of $11.1 million a year on an eight-year, $88.9-million extension, and has done ads for Old Spice and McDonald’s." },
  { id:"slafkovsky", name:"Juraj Slafkovsky", initials:"JS", photos:["42.png"], pay:7.6,
    team:"Hockey · Montreal Canadiens",
    blurb:"The Slovak forward from Košice was drafted by Montreal in 2022 after leading that year’s Winter Olympics in scoring and being named MVP as Slovakia won its first Olympic hockey medal, a bronze. Last April, he scored his first hat trick, leading the Canadiens to a 4-3 overtime win over Tampa Bay in the first round of the playoffs." },
  { id:"mathurin", name:"Bennedict Mathurin", initials:"BM", photos:["43.png"], pay:7.5,
    team:"Basketball · New Orleans Pelicans",
    blurb:"Like Dort, the Montreal North native got his start with Montreal teams such as the Parc-Ex Knights and Brookwood Elite; he then starred for the University of Arizona. Drafted by Indiana in 2022, he finished fourth in rookie-of-the-year voting and was traded last season to the Los Angeles Clippers. He asked the Clippers to withdraw an extension offer so he could join New Orleans, where he is competing for a starting spot." },
  { id:"lafreniere", name:"Alexis Lafrenière", initials:"AL", photos:["44.png"], big:"0310 spt habsgamer.jpg", pay:7.45,
    team:"Hockey · New York Rangers",
    blurb:"The St-Eustache native was named the QMJHL’s rookie of the year with the Rimouski Océanic before the New York Rangers drafted him first overall in 2020. After a breakout finish to a lacklustre 2025-26 season for the team, he has seven goals and 10 points so far this year, as the Rangers have won six of their eight games." },
  { id:"letang", name:"Kristopher Letang", initials:"KL", photos:["45.png"], pay:6.1,
    team:"Hockey · Pittsburgh Penguins",
    blurb:"The 39-year-old Montreal native has spent his entire NHL career with the Pittsburgh Penguins, who drafted him in 2005. He has played 20 seasons alongside Sidney Crosby and Evgeni Malkin, a record in North American sport, and has won three Stanley Cups." },
  { id:"matheson", name:"Mike Matheson", initials:"MM", photos:["46.png"], pay:6,
    team:"Hockey · Montreal Canadiens",
    blurb:"The only player on the list who is both from Montreal and plays for Montreal, the Pointe-Claire native played two seasons for the Lac-St-Louis Lions in Dollard-des-Ormeaux before heading to Boston College. Drafted by the Florida Panthers and traded to Pittsburgh in 2020, he came home in a trade to the Canadiens two years later." },
];
 
/* =====================================================================
   App
   ===================================================================== */
(function(){
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
  // US$ millions -> C$, one decimal ($50.5M). Two decimals only where neighbours would otherwise look tied.
  const cad = (p) => p.pay * (CONFIG.usdToCad || 1);
  const r1 = (v) => Math.round(v * 10) / 10;
  const pay = (p) => {
    const i = ATHLETES.indexOf(p), v = cad(p);
    const tied = [ATHLETES[i - 1], ATHLETES[i + 1]].some(q => q && !q.blank && r1(cad(q)) === r1(v));
    return "$" + (tied ? (Math.round(v * 100) / 100) : r1(v)) + "M";
  };
 
  ATHLETES.forEach((p, i) => { p.rank = i + 1; });
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const root = document.documentElement;
  const main = $("rl");
  let fitQueued = false;
 
  /* ---------- rotating title ---------- */
  (function rotator(){
    const host = $("rl-rot");
    $("rl-title-sr").textContent = CONFIG.title;
    const qs = (CONFIG.questions || []).filter(Boolean);
    if (!qs.length) { host.textContent = CONFIG.title; return; }
    host.innerHTML = qs.map(q => `<span class="q">${
      q.split(/\s+/).map((w, i) => `<span class="w" style="--i:${i}">${esc(w)}</span>`).join(" ")
    }</span>`).join("");
    const els = [...host.children];
    let at = 0, timer = null, visible = true, hovered = false;
    els[0].classList.add("on");
    if (reduceMotion || els.length < 2) return;      // one still question for people who turn motion off
    function advance(){
      const cur = els[at];
      at = (at + 1) % els.length;
      const nxt = els[at];
      cur.classList.remove("on"); cur.classList.add("out");
      setTimeout(() => cur.classList.remove("out"), 420);
      setTimeout(() => nxt.classList.add("on"), 180);
    }
    function sync(){
      const run = visible && !hovered && !document.hidden;
      if (run && !timer) timer = setInterval(advance, (CONFIG.questionSeconds || 3) * 1000);
      if (!run && timer) { clearInterval(timer); timer = null; }
    }
    // Only rotates while it's on screen, and holds still while a mouse rests on it.
    if ("IntersectionObserver" in window) {
      new IntersectionObserver(es => { visible = es.some(e => e.isIntersecting); sync(); }).observe(host);
    }
    host.addEventListener("mouseenter", () => { hovered = true; sync(); });
    host.addEventListener("mouseleave", () => { hovered = false; sync(); });
    document.addEventListener("visibilitychange", sync);
    sync();
  })();
 
  /* ---------- flickering photos under the title ---------- */
  (function flicker(){
    const host = $("rl-flick");
    const noPhotos = () => { host.hidden = true; $("rl-intro").classList.add("noflick"); fitSoon(); };
    const pics = ATHLETES.filter(p => p.big && !p.blank);     // in list order
    if (!pics.length) { noPhotos(); return; }
    host.innerHTML = pics.map((p, k) => `<figure class="fr ${k % 2 ? "light" : "dark"}">
        <img src="${esc(encodeURI(p.big))}" alt="" loading="lazy" decoding="async"${p.bigPos ? ` style="object-position:${esc(p.bigPos)}"` : ""}>
        <figcaption><span>No. ${p.rank}</span>${esc(p.bigCaption || p.name)}</figcaption>
      </figure>`).join("");
    let frames = [...host.children], at = 0, timer = null, visible = true;
    const show = (k) => {
      frames.forEach((f, j) => f.classList.toggle("on", j === k));
      for (let a = 0; a <= 2; a++) {                        // load this photo and the next two
        const im = frames[(k + a) % frames.length].querySelector("img");
        if (im.loading !== "eager") im.loading = "eager";
      }
    };
    // A photo that fails to load (wrong file name, say) drops out instead of showing an empty box.
    host.addEventListener("error", (e) => {
      const f = e.target.closest && e.target.closest(".fr");
      if (!f) return;
      const wasOn = f.classList.contains("on");
      f.remove();
      frames = [...host.children];
      if (!frames.length) { noPhotos(); return; }
      at = at % frames.length;
      if (wasOn) show(at);
    }, true);
    show(0);
    if (reduceMotion || frames.length < 2) return;        // one still photo for people who turn motion off
    const tick = () => { if (frames.length > 1) { at = (at + 1) % frames.length; show(at); } };
    const sync = () => {
      const run = visible && !document.hidden;
      if (run && !timer) timer = setInterval(tick, (CONFIG.flickerSeconds || 1.5) * 1000);
      if (!run && timer) { clearInterval(timer); timer = null; }
    };
    if ("IntersectionObserver" in window) {
      new IntersectionObserver(es => { visible = es.some(e => e.isIntersecting); sync(); }).observe(host);
    }
    document.addEventListener("visibilitychange", sync);
    sync();
  })();
  function portrait(p){
    const ph = (p.photos || []).filter(Boolean).slice(0, 3);
    if (!ph.length) return `<div class="rl-pics n1"><div class="rl-pic init"><span aria-hidden="true">${esc(p.initials || "")}</span></div></div>`;
    return `<div class="rl-pics n${ph.length}">${ph.map(src =>
      `<div class="rl-pic"><img src="${esc(src)}" alt="" loading="lazy" decoding="async"></div>`).join("")}</div>`;
  }
 
  const list = $("rl-list");
  list.innerHTML = ATHLETES.map(p => p.blank
    ? `<li class="rl-item rl-blank" id="rl-i-${p.blank === true ? "blank-" + p.rank : p.id}"><div class="rl-txt"><div class="rl-head"><div><div class="rl-rank">${p.rank}.</div></div><div class="rl-who"></div></div></div></li>`
    : `<li class="rl-item" id="rl-i-${p.id}">
      <div class="rl-txt">
        <div class="rl-head">
          <div><div class="rl-rank">${p.rank}.</div></div>
          <div class="rl-who"><h3 class="rl-name">${esc(p.name)}</h3><span class="rl-co">${esc(p.team)}</span></div>
        </div>
        <div class="rl-body">${[].concat(p.blurb || []).map(t => `<p>${esc(t)}</p>`).join("")}</div>
      </div>
      <div class="rl-side">
        <div class="rl-val">${pay(p)}</div>
        ${portrait(p)}
      </div>
    </li>`).join("");
 
  // A missing photo falls back to initials.
  list.addEventListener("error", (e) => {
    const img = e.target; if (!img || img.tagName !== "IMG") return;
    const pic = img.closest(".rl-pic"), li = img.closest(".rl-item");
    const p = ATHLETES.find(x => "rl-i-" + x.id === (li && li.id));
    if (pic && p) { pic.classList.add("init"); pic.innerHTML = `<span aria-hidden="true">${esc(p.initials || "")}</span>`; }
  }, true);
 
  $("rl-notes").innerHTML = (CONFIG.notes || []).map(t => `<p>${esc(t)}</p>`).join("");
 
  /* ---------- same total height at every screen width ---------- */
  // Narrow screens wrap the profiles onto more lines, so on its own the page grows taller
  // as the screen gets narrower. Here the profile text is sized so the page always comes
  // out at CONFIG.height: a little smaller on the narrowest phones, a little larger where
  // there's room. Whatever is left over (less than a line) is added at the bottom.
  function fitHeight(){
    const H = +CONFIG.height || 0;
    main.style.paddingBottom = "";
    if (!H) { main.style.removeProperty("--pfs"); return; }
    const [minFs, maxFs] = CONFIG.textSize || [15.5, 24];
    const heightAt = (fs) => { main.style.setProperty("--pfs", fs + "px"); return root.getBoundingClientRect().height; };
    let lo = Math.round(minFs * 10), hi = Math.round(maxFs * 10), best = lo;
    if (heightAt(lo / 10) <= H) {
      while (lo <= hi) {                                  // largest size that still fits
        const mid = (lo + hi) >> 1;
        if (heightAt(mid / 10) <= H) { best = mid; lo = mid + 1; } else hi = mid - 1;
      }
    }
    const spare = H - heightAt(best / 10);
    if (spare > 0) main.style.paddingBottom = (parseFloat(getComputedStyle(main).paddingBottom) + spare) + "px";
  }
  function fitSoon(){
    if (fitQueued) return;
    fitQueued = true;
    requestAnimationFrame(() => { fitQueued = false; fitHeight(); });
  }
  fitHeight();
  // Refit when the width changes (rotating a phone, resizing a window) and once the web font arrives.
  let lastW = main.clientWidth;
  new ResizeObserver(() => { const w = main.clientWidth; if (w !== lastW) { lastW = w; fitSoon(); } }).observe(main);
  if (document.fonts) {
    document.fonts.ready.then(fitSoon);
    if (document.fonts.addEventListener) document.fonts.addEventListener("loadingdone", fitSoon);
  }
 
  // Deep link: embed URL ending in #suzuki jumps to that profile.
  const hash = decodeURIComponent(location.hash.replace(/^#(p=)?/, ""));
  const target = hash && document.getElementById("rl-i-" + hash);
  if (target) requestAnimationFrame(() => {
    target.scrollIntoView({ block:"start" });
    if (window.parent !== window) window.parent.postMessage({ type:"richlist:sports-scrollTo", offset: Math.round(target.getBoundingClientRect().top + window.scrollY) }, "*");
  });
 
  // "Read the full profiles" scrolls down to the list. If this page scrolls by itself
  // (opened directly, or in a preview), scroll it here; inside an article iframe sized to
  // fit its content, ask the host page to scroll.
  const scrollsItself = () => window.parent === window || root.scrollHeight > window.innerHeight + 2;
  $("rl-jump").addEventListener("click", () => {
    if (scrollsItself()) {
      list.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block:"start" });
    } else {
      window.parent.postMessage({ type:"richlist:sports-scrollTo", offset: Math.round(list.getBoundingClientRect().top + window.scrollY) }, "*");
    }
  });
 
  if (window.parent !== window) window.parent.postMessage({ type:"richlist:sports-ready" }, "*");
 
  // Tell the host page our height so the iframe never needs its own scrollbar.
  let lastH = 0;
  function postHeight(){
    const h = Math.ceil(document.documentElement.getBoundingClientRect().height);
    if (h !== lastH && window.parent !== window) {
      lastH = h;
      window.parent.postMessage({ type:"richlist:sports-height", height:h }, "*");
    }
  }
  new ResizeObserver(postHeight).observe(document.documentElement);
  window.addEventListener("load", postHeight);
})();
</script>
</body>
</html>
