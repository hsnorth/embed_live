<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<title>Montreal’s highest-paid sports stars 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,200..800&display=swap" rel="stylesheet">
<style>
/* ------------------------------------------------------------------
   House style: black serif type on white.
   Newsreader is the web stand-in; swap the font-family below for the
   house faces if they are available to embeds.
------------------------------------------------------------------- */
:root{
  --grade:saturate(.78) contrast(1.06) brightness(1.02) sepia(.07);
  --wash:rgba(238, 224, 204, .22);
  --font:"Newsreader","Tiempos Text",Georgia,"Times New Roman",serif;
  --bg:#ffffff;
  --ink:#111111;
  --ink-2:#333333;
  --muted:#6b6b6b;
  --hair:#e4e4e4;
  --hair-2:#cdcdcd;
  --face-bg:#e8e8e8;
  --face-ink:#4a4a4a;
  --focus:#111111;
  color-scheme:only light;
}

html,body{margin:0;background:var(--bg);}
*{box-sizing:border-box;}
.rl{
  max-width:760px;margin:0 auto;padding:0 16px 24px;
  font-family:var(--font);font-optical-sizing:auto;
  font-size:17px;line-height:1.45;color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
.rl [hidden]{display:none !important;}
.rl :focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:2px;}

/* Title: same face, size and weight as the rich list's rotating question */
.rl-title{
  margin:0;padding:28px 0 28px;font-weight:400;letter-spacing:-.01em;line-height:1.08;
  font-size:clamp(1.6rem,5.2vw,2.3rem);
}
@media (max-width:639px){ .rl-title{font-size:clamp(2rem,8.2vw,2.4rem);padding:24px 0 24px;} }

/* List */
.rl-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink);scroll-margin-top:0;}
/* Each profile. Phones: rank, name and pay on top, then the photo, then the details.
   Wider screens: details take two thirds, pay and photo sit centred in the last third. */
.rl-item{
  --rk:2.4rem;
  display:grid;grid-template-columns:minmax(0,1fr) auto;
  grid-template-areas:"head val" "pic pic" "body body";
  column-gap:12px;padding:18px 4px 20px;border-bottom:1px solid var(--hair);
  scroll-margin-top:12px;
}
.rl-txt,.rl-side{display:contents;}
.rl-head{grid-area:head;display:grid;grid-template-columns:var(--rk) minmax(0,1fr);column-gap:10px;align-items:start;}
.rl-rank{font-weight:300;font-size:24px;line-height:1.05;color:var(--ink);font-variant-numeric:lining-nums tabular-nums;}
.rl-mv{display:flex;align-items:center;gap:3px;margin-top:5px;font-size:12.5px;color:var(--muted);font-variant-numeric:lining-nums tabular-nums;white-space:nowrap;}
.rl-mv .dash{font-weight:800;color:var(--ink);}
.rl-new{font-size:11.5px;font-weight:600;padding:0 6px;border-radius:999px;border:1px solid var(--ink);color:var(--ink);}
.rl-who{min-width:0;}
.rl-name{display:block;margin:0;font-weight:400;font-size:20px;line-height:1.25;}
.rl-co{display:block;font-size:15px;color:var(--muted);line-height:1.35;margin-top:2px;}
.rl-val{grid-area:val;font-weight:700;font-size:19px;line-height:1.2;font-variant-numeric:lining-nums;white-space:nowrap;text-align:right;}
/* Portraits: one, two or three circles that scale with the screen.
   Groups overlap slightly, each circle kept apart by a thin white ring. */
.rl-pics{
  grid-area:pic;justify-self:center;margin:16px 0 0;
  display:flex;justify-content:center;align-items:center;
  --d:clamp(92px, 28vw, 120px);
}
.rl-pics.n2{--d:clamp(84px, 24vw, 108px);}
.rl-pics.n3{--d:clamp(72px, 21vw, 96px);}
.rl-pic{
  position:relative;flex:none;width:var(--d);height:var(--d);border-radius:50%;overflow:hidden;
  background:var(--bg);box-shadow:0 0 0 3px var(--bg),0 0 0 4px var(--hair-2);
  display:grid;place-items:center;
}
.rl-pic + .rl-pic{margin-left:calc(var(--d) * -.12);}
.rl-pic.init{background:var(--face-bg);}
.rl-pic img{width:100%;height:100%;object-fit:cover;display:block;filter:var(--grade);}
.rl-pic:not(.init)::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--wash);mix-blend-mode:multiply;pointer-events:none;}
.rl-pic span{font-weight:600;font-size:calc(var(--d) * .3);color:var(--face-ink);letter-spacing:.02em;}
.rl-body{grid-area:body;padding:16px 0 0 calc(var(--rk) + 10px);min-width:0;}
.rl-body p{margin:0 0 14px;max-width:60ch;font-size:16.5px;line-height:1.5;}
.rl-body p:last-child{margin-bottom:0;}
@media (max-width:639px){
  .rl-item{--rk:2.9rem;padding:20px 2px 22px;}
  .rl-rank{font-size:30px;}
  .rl-mv{font-size:13.5px;}
  .rl-name{font-size:23px;}
  .rl-co{font-size:16.5px;}
  .rl-val{font-size:22px;}
  .rl-body p{font-size:18.5px;line-height:1.5;}
}
@media (min-width:640px){
  .rl-item{grid-template-columns:minmax(0,2fr) minmax(0,1fr);grid-template-areas:none;column-gap:28px;padding:22px 4px 24px;}
  .rl-txt{display:block;}
  .rl-side{display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:2px;}
  .rl-val{font-size:24px;text-align:center;}
  .rl-pics{margin:0;justify-self:auto;--d:clamp(88px, 13vw, 112px);}
  .rl-pics.n2{--d:clamp(72px, 10.5vw, 92px);}
  .rl-pics.n3{--d:clamp(60px, 9vw, 76px);}
  .rl-rank{font-size:26px;}
}

/* Notes */
.rl-notes{margin-top:22px;font-size:14.5px;color:var(--muted);}
.rl-notes p{margin:0 0 8px;}
.rl-notes strong{color:var(--ink-2);font-weight:600;}
</style>
</head>
<body>
<main class="rl" id="rl">
  <h2 class="rl-title" id="rl-title"></h2>
  <ol class="rl-list" id="rl-list" aria-labelledby="rl-title"></ol>
  <footer class="rl-notes" id="rl-notes"></footer>
</main>

<script>
/* =====================================================================
   DATA — the only part you need to edit.
   Order the array by rank (index 0 = No. 1).
   pay:    annual salary in US$ millions, as reported. The page converts it to
           Canadian dollars with usdToCad below (35.7 shows as $50.5M).
   blank:  true keeps the spot and its number but shows nothing else.
   team:   the line under the name.
   blurb:  the profile (a list of strings makes separate paragraphs).
   photos: one to three square headshots shown as circles, e.g. ["s1.png"].
           Paths are relative to this page. Leave [] for initials.
   initials: shown in the circle while there is no photo.
   ===================================================================== */
const CONFIG = {
  title: "Montreal’s highest-paid sports stars",
  // Bank of Canada daily rate, Oct. 16, 2026: US$1 = C$1.4154. If you change it, change the note too,
  // and the converted amounts written into the profiles.
  usdToCad: 1.4154,
  notes: ["Salaries in Canadian dollars, converted from U.S. dollars at the Bank of Canada’s Oct. 16, 2026, rate of $1.4154. Most are the average annual value of each player’s contract; Lance Stroll’s and Yassine Bounou’s pay isn’t disclosed, so their figures are estimates."],
};

const ATHLETES = [
  { id:"guerrero", name:"Vladimir Guerrero Jr.", initials:"VG", photos:[], pay:35.7,
    team:"Toronto Blue Jays · First baseman",
    blurb:"Montrealers have seen the 27-year-old Blue Jays first baseman in an Expos uniform: in 2002, aged three, he joined his father, Expos star Vladimir Guerrero, on the diamond. His 14-year contract, worth about $708 million, averages about $50.5 million a year, though because of the way it’s structured he will actually make about $42.5 million this year, after $68.6 million last year. Like his dad, he’s known for hitting home runs, with 192 in his career, and was named an all-star for the sixth year in a row this season." },
  { id:"dort", name:"Luguentz “Lu” Dort", initials:"LD", photos:[], pay:17.7,
    team:"Atlanta Hawks · Guard",
    blurb:"The son of Haitian immigrants, Dort grew up in Montreal North playing soccer before discovering basketball in neighbourhood parks and joining his first team, in Parc-Ex, at about 12 or 13. Known for his defence, he played for Canada at the Paris Olympics and regularly returns to Montreal North for community events. He’s earning about $25.1 million this season on the five-year, $123.8-million contract he signed in 2022." },
  { id:"stroll", name:"Lance Stroll", initials:"LS", photos:[], pay:12.75,
    team:"Aston Martin Aramco · Formula One driver",
    blurb:"The Montreal-born driver’s salary isn’t declared, but Aston Martin, owned by his billionaire father, Lawrence Stroll, paid £9.6 million (about $18.1 million) in 2025 for “racing services” to Golden Eagle Racing, a company he controls. Those payments may not exactly match his pay, but it’s not a bad payday for a driver who has never finished better than third in an F1 race and hasn’t reached the podium since 2020." },
  { id:"bounou", name:"Yassine “Bono” Bounou", initials:"YB", photos:[], pay:11,
    team:"Al-Hilal · Goalkeeper",
    blurb:"Born in Montreal, Bono moved with his parents to their native Morocco as a small child and grew up in Casablanca. He spent most of his career in Spain, most recently with Sevilla, before joining Riyadh-based Al-Hilal, and plays for Morocco internationally. His salary isn’t disclosed, so the figure is an estimate based on several sources." },
  { id:"huberdeau", name:"Jonathan Huberdeau", initials:"JH", photos:[], pay:10.5,
    team:"Calgary Flames · Centre",
    blurb:"Raised around Saint-Jérôme, where his father owned a car dealership in Prévost, Huberdeau broke through as a teenager with the Saint-Eustache Vikings, leading the Quebec Midget AAA league in scoring in 2008-09. After winning the 2011 Memorial Cup with the Saint John Sea Dogs, he won the Calder Trophy with the Florida Panthers and was traded to Calgary in 2022. He hosts an annual golf tournament for Laval’s Cité-de-la-Santé hospital and is the spokesman for Quebec ball hockey equipment maker Knapper." },
  { id:"dobson", name:"Noah Dobson", initials:"ND", photos:[], pay:9.5,
    team:"Montreal Canadiens · Defenceman",
    blurb:"The Summerside, P.E.I., native won back-to-back Memorial Cups, with Acadie-Bathurst in 2018 and then with Rouyn-Noranda after a trade. Drafted by the New York Islanders in 2018, he was traded to the Habs in 2025 and is on an eight-year, $107.6-million contract. Last season, the defenceman had 12 goals and 35 assists." },
  { id:"hutson", name:"Lane Hutson", initials:"LH", photos:[], pay:8.85,
    team:"Montreal Canadiens · Defenceman",
    blurb:"The Michigan-born defenceman, who grew up near Chicago, played for Boston University before making his Canadiens debut in 2024, two years after Montreal drafted him. Scouts questioned whether he was big enough for the NHL, but he won the Calder Trophy as a rookie, the Habs’ first since Ken Dryden in 1972. According to The Athletic’s Dom Luszczyszyn, his eight-year, $100.2-million deal is the best in the league for his team, as his play could be worth around $28 million a year." },
  { id:"dubois", name:"Pierre-Luc Dubois", initials:"PD", photos:[], pay:8.5,
    team:"Washington Capitals · Left wing",
    blurb:"Born in Sainte-Agathe-des-Monts and raised in Rimouski, Dubois played junior hockey for Cape Breton and Blainville-Boisbriand before Columbus drafted him. Traded to Winnipeg in 2021, he reportedly sought a move to Montreal, but the Habs passed; after a season in Los Angeles, he was traded to Washington. He is starting his third season with the Capitals after injuries cost him much of last season." },
  { id:"suzuki", name:"Nick Suzuki", initials:"NS", photos:[], pay:7.875,
    team:"Montreal Canadiens · Captain and centre",
    blurb:"The Habs captain from London, Ont., signed his eight-year, $89.2-million deal in 2021 and has acknowledged it now pays less than contracts signed by other stars as salaries rise. Some Canadiens have accepted less than they could earn elsewhere because they want to win in Montreal, he said in August, adding that he and his teammates still earn enough to live comfortably for the rest of their lives. Off the ice, he has done ads for Bauer, Tim Hortons and Hellmann’s, among others." },
  { id:"caufield", name:"Cole Caufield", initials:"CC", photos:[], pay:7.85,
    team:"Montreal Canadiens · Forward",
    blurb:"Born in Mosinee, Wis., Caufield was drafted by Montreal in 2019 and won the Hobey Baker Award as U.S. college hockey’s top player at the University of Wisconsin in 2021. He made his NHL debut with the Habs that spring and joined their run to the Stanley Cup final. He earns an average of $11.1 million a year on an eight-year, $88.9-million extension, and has done ads for Old Spice and McDonald’s." },
  { id:"slafkovsky", name:"Juraj Slafkovsky", initials:"JS", photos:[], pay:7.6,
    team:"Montreal Canadiens · Left wing",
    blurb:"The Slovak forward from Košice was drafted by Montreal in 2022 after leading that year’s Winter Olympics in scoring and being named MVP as Slovakia won its first Olympic hockey medal, a bronze. Last April, he scored his first hat trick, leading the Canadiens to a 4-3 overtime win over Tampa Bay in the first round of the playoffs." },
  { id:"mathurin", name:"Bennedict Mathurin", initials:"BM", photos:[], pay:7.5,
    team:"New Orleans Pelicans · Guard and small forward",
    blurb:"Like Lu Dort, the Montreal North native got his start with Montreal teams such as the Parc-Ex Knights and Brookwood Elite, then starred for the University of Arizona. Drafted by Indiana in 2022, he finished fourth in rookie of the year voting and was traded last season to the Los Angeles Clippers. He asked the Clippers to withdraw an extension offer so he could join New Orleans, where he is competing for a starting spot." },
  { id:"lafreniere", name:"Alexis Lafrenière", initials:"AL", photos:[], pay:7.45,
    team:"New York Rangers · Left wing",
    blurb:"The Saint-Eustache native was named the QMJHL’s rookie of the year with the Rimouski Océanic before the New York Rangers drafted him first overall in 2020. After a breakout finish to a lacklustre 2025-26 season for the team, he has seven goals and 10 points so far this year, as the Rangers have won six of their eight games." },
  { id:"letang", name:"Kristopher Letang", initials:"KL", photos:[], pay:6.1,
    team:"Pittsburgh Penguins · Defenceman",
    blurb:"The 39-year-old Montreal native has spent his entire NHL career with the Pittsburgh Penguins, who drafted him in 2005. He has played 20 seasons alongside Sidney Crosby and Evgeni Malkin, a record in North American sport, and won three Stanley Cups." },
  { id:"matheson", name:"Mike Matheson", initials:"MM", photos:[], pay:6,
    team:"Montreal Canadiens · Defenceman",
    blurb:"The only player on the list who is both from Montreal and plays for Montreal, the Pointe-Claire native played two seasons for the Lac-Saint-Louis Lions in Dollard-des-Ormeaux before heading to Boston College. Drafted by the Florida Panthers and traded to Pittsburgh in 2020, he came home in a trade to the Canadiens two years later." },
];

/* =====================================================================
   App
   ===================================================================== */
(function(){
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
  // US$ millions -> C$, one decimal ($50.5M). Two decimals only where neighbours would otherwise look tied.
  const cad = (p) => p.pay * (CONFIG.usdToCad || 1);
  const r1 = (v) => Math.round(v * 10) / 10;
  const pay = (p) => {
    const i = ATHLETES.indexOf(p), v = cad(p);
    const tied = [ATHLETES[i - 1], ATHLETES[i + 1]].some(q => q && !q.blank && r1(cad(q)) === r1(v));
    return "$" + (tied ? (Math.round(v * 100) / 100) : r1(v)) + "M";
  };

  $("rl-title").textContent = CONFIG.title;
  ATHLETES.forEach((p, i) => { p.rank = i + 1; });

  function portrait(p){
    const ph = (p.photos || []).filter(Boolean).slice(0, 3);
    if (!ph.length) return `<div class="rl-pics n1"><div class="rl-pic init"><span aria-hidden="true">${esc(p.initials || "")}</span></div></div>`;
    return `<div class="rl-pics n${ph.length}">${ph.map(src =>
      `<div class="rl-pic"><img src="${esc(src)}" alt="" loading="lazy" decoding="async"></div>`).join("")}</div>`;
  }

  const list = $("rl-list");
  list.innerHTML = ATHLETES.map(p => p.blank
    ? `<li class="rl-item rl-blank" id="rl-i-${p.blank === true ? "blank-" + p.rank : p.id}"><div class="rl-txt"><div class="rl-head"><div><div class="rl-rank">${p.rank}.</div></div><div class="rl-who"></div></div></div></li>`
    : `<li class="rl-item" id="rl-i-${p.id}">
      <div class="rl-txt">
        <div class="rl-head">
          <div><div class="rl-rank">${p.rank}.</div></div>
          <div class="rl-who"><h3 class="rl-name">${esc(p.name)}</h3><span class="rl-co">${esc(p.team)}</span></div>
        </div>
        <div class="rl-body">${[].concat(p.blurb || []).map(t => `<p>${esc(t)}</p>`).join("")}</div>
      </div>
      <div class="rl-side">
        <div class="rl-val">${pay(p)}</div>
        ${portrait(p)}
      </div>
    </li>`).join("");

  // A missing photo falls back to initials.
  list.addEventListener("error", (e) => {
    const img = e.target; if (!img || img.tagName !== "IMG") return;
    const pic = img.closest(".rl-pic"), li = img.closest(".rl-item");
    const p = ATHLETES.find(x => "rl-i-" + x.id === (li && li.id));
    if (pic && p) { pic.classList.add("init"); pic.innerHTML = `<span aria-hidden="true">${esc(p.initials || "")}</span>`; }
  }, true);

  $("rl-notes").innerHTML = (CONFIG.notes || []).map(t => `<p>${esc(t)}</p>`).join("");

  // Deep link: embed URL ending in #suzuki jumps to that profile.
  const hash = decodeURIComponent(location.hash.replace(/^#(p=)?/, ""));
  const target = hash && document.getElementById("rl-i-" + hash);
  if (target) requestAnimationFrame(() => {
    target.scrollIntoView({ block:"start" });
    if (window.parent !== window) window.parent.postMessage({ type:"richlist:sports-scrollTo", offset: Math.round(target.getBoundingClientRect().top + window.scrollY) }, "*");
  });

  // Tell the host page our height so the iframe never needs its own scrollbar.
  let lastH = 0;
  function postHeight(){
    const h = Math.ceil(document.documentElement.getBoundingClientRect().height);
    if (h !== lastH && window.parent !== window) {
      lastH = h;
      window.parent.postMessage({ type:"richlist:sports-height", height:h }, "*");
    }
  }
  new ResizeObserver(postHeight).observe(document.documentElement);
  window.addEventListener("load", postHeight);
})();
</script>
</body>
</html>
