<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<title>BigShot: match the fortune to the story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,200..800&display=swap" rel="stylesheet">
<style>
/* House fonts, softer surfaces: rounded cards that float on the page. */
:root{
  --font:"Newsreader","Tiempos Text",Georgia,"Times New Roman",serif;
  --bg:#ffffff;
  --ink:#111111;
  --ink-2:#3a3a3a;
  --muted:#6b6b6b;
  --hair:#ececec;
  --line:#dcdcdc;
  --surface:#ffffff;
  --surface-2:#f5f5f2;
  --tint:#efefec;
  --hover:#f7f7f5;
  --right-bg:#e6f4ea; --right-ink:#188038;
  --wrong-bg:#fce8e6; --wrong-ink:#c5221f;
  --shadow:0 1px 2px rgba(0,0,0,.07),0 3px 12px rgba(0,0,0,.07);
  --face-bg:#ececea;
  --face-ink:#4a4a4a;
  --focus:#111111;
  color-scheme:only light;
}

html,body{margin:0;background:var(--bg);}
*{box-sizing:border-box;}
.ww{
  max-width:640px;margin:0 auto;padding:22px 16px 28px;
  font-family:var(--font);font-optical-sizing:auto;font-size:17px;line-height:1.45;color:var(--ink);
  -webkit-font-smoothing:antialiased;
  /* Fixed heights, so the whole embed is the same height on every screen width
     (628px with these cards). --card-h grows by itself if a card's text needs more room. */
  --card-h:266px;
  --title-h:84px;          /* two lines of the title at its largest */
  --opts-h:194px;
  --gap:16px;
}
.ww [hidden]{display:none !important;}
.ww :focus-visible{outline:2px solid var(--focus);outline-offset:3px;}
.ww button{font:inherit;color:inherit;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;}

/* The title is always the largest text; the card text is sized just below it.
   Room for two lines is kept on every width, so the height never changes. */
/* Same size, weight and colour as the list embed's title. Room for the most lines it can
   take is always kept (--title-h), so the embed stays the same height on every width. */
.ww-title{margin:0 0 18px;min-height:var(--title-h);font-weight:400;letter-spacing:-.01em;line-height:1.08;color:var(--ink);
  font-size:clamp(1.6rem,5.2vw,2.3rem);}
@media (max-width:639px){ .ww-title{font-size:clamp(2rem,8.2vw,2.4rem);} }
/* the very narrowest phones: a hair smaller, so the title still fits on two lines */
@media (max-width:349px){ .ww-title{font-size:29px;} }
.ww-title .t{font-weight:600;}

/* The card: front holds the story, back holds the answer. Both faces share one grid
   cell, so the card is as tall as the taller face and nothing moves when it flips. */
.ww-card{perspective:1400px;}
.ww-inner{display:grid;transform-style:preserve-3d;transition:transform .42s cubic-bezier(.3,.7,.2,1);}
.ww-card.flipped .ww-inner{transform:rotateY(180deg);}
.ww-face{
  grid-area:1 / 1;display:flex;flex-direction:column;min-height:var(--card-h);padding:16px 20px 24px;
  border-radius:16px;background:var(--surface);box-shadow:var(--shadow);
  -webkit-backface-visibility:hidden;backface-visibility:hidden;
}
.ww-back{position:relative;background:var(--surface-2);transform:rotateY(180deg);cursor:pointer;}
.ww-meta{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:24px;
  font-size:14.5px;color:var(--muted);font-variant-numeric:lining-nums tabular-nums;}
.ww-body{flex:1;display:flex;flex-direction:column;justify-content:center;padding-top:14px;}
.ww-story{margin:0;font-size:19.5px;line-height:1.3;}
.ww-verdict{display:inline-flex;align-items:center;gap:7px;color:var(--ink);font-weight:500;font-size:15px;}
.ww-verdict .ic{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;
  background:var(--ink);color:var(--bg);font-size:11.5px;font-weight:700;line-height:1;}
.ww-verdict.is-right .ic{background:var(--right-ink);color:#fff;}
.ww-verdict.is-wrong .ic{background:var(--wrong-ink);color:#fff;}
.ww-ans{margin:0;font-size:19.5px;line-height:1.2;font-weight:500;}
@media (min-width:600px){ .ww-story,.ww-ans{font-size:24px;} }
.ww-detail{margin:4px 0 0;font-size:16px;color:var(--muted);font-variant-numeric:lining-nums;}
/* the fortune, counted up from $0 while the answer is showing */
.ww-worth{margin:6px 0 0;font-size:19.5px;line-height:1.2;font-weight:600;letter-spacing:.01em;
  font-variant-numeric:lining-nums tabular-nums;white-space:nowrap;}
@media (min-width:600px){ .ww-worth{font-size:22px;} }
.ww-reveal{margin:12px 0 0;font-size:16.5px;line-height:1.45;color:var(--ink-2);}
.ww-card.deal .ww-front{animation:ww-deal .36s cubic-bezier(.2,.75,.25,1);}
@keyframes ww-deal{from{opacity:0;transform:translateY(10px);}}

/* Choices */
.ww-opts{list-style:none;margin:var(--gap) 0 0;padding:0;display:grid;height:var(--opts-h);}
.ww-opts li{display:flex;min-width:0;}
/* wider screens: 2 x 2, spaced out to fill the same height as the stacked list on phones */
@media (min-width:600px){
  .ww-opts{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;column-gap:10px;row-gap:16px;}
}
.ww-opt{
  display:flex;align-items:center;gap:12px;width:100%;height:100%;padding:8px 14px 8px 10px;
  border:1px solid var(--line);border-radius:12px;background:var(--bg);
  font-size:17px;line-height:1.25;text-align:left;cursor:pointer;
  transition:background-color .15s ease,border-color .15s ease,opacity .2s ease;
}
.ww-opt.biz{padding-left:16px;}
.ww-opt:hover:not(:disabled){background:var(--hover);}
.ww-opt:disabled{cursor:default;}
.ww-pic{flex:none;width:36px;height:36px;border-radius:50%;overflow:hidden;background:var(--face-bg);
  display:grid;place-items:center;color:var(--face-ink);font-size:13px;font-weight:600;letter-spacing:.02em;}
.ww-pic img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.78) contrast(1.06) brightness(1.02) sepia(.07);}
.ww-pic.has-img{background:var(--bg);box-shadow:0 0 0 1px var(--line);}
.ww-opt .nm{min-width:0;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;}
.ww-opt .mk{margin-left:auto;flex:none;font-weight:700;font-size:15px;}
.ww-opt.right{background:var(--right-bg);border-color:var(--right-bg);}
.ww-opt.right .nm{font-weight:500;}
.ww-opt.right .mk{color:var(--right-ink);}
.ww-opt.wrong{background:var(--wrong-bg);border-color:var(--wrong-bg);}
.ww-opt.wrong .mk{color:var(--wrong-ink);}
.ww-opts.done .ww-opt:not(.right):not(.wrong){opacity:.45;}
/* phones: one choice per line, kept compact so the four take little more room than a 2 x 2 grid */
@media (max-width:599px){
  .ww-opts{grid-template-rows:repeat(4,1fr);gap:6px;}
  .ww-opt{padding:3px 12px 3px 8px;gap:10px;font-size:16.5px;line-height:1.15;border-radius:10px;}
  .ww-opt.biz{padding-left:14px;}
  .ww-pic{width:30px;height:30px;font-size:11.5px;}
}

/* Buttons */
.ww-btn{
  display:block;width:100%;height:50px;margin-top:var(--gap);border:0;border-radius:999px;
  background:var(--ink);color:var(--bg) !important;font-size:17px;font-weight:500;cursor:pointer;
}
.ww-btn.ghost{background:var(--bg);color:var(--ink) !important;border:1px solid var(--line);}
.ww-btn.ghost:hover{background:var(--hover);}
.ww-btn.wait{visibility:hidden;}

/* End screen */
.ww-end-card{border-radius:16px;background:var(--surface);box-shadow:var(--shadow);padding:16px 20px 26px;min-height:var(--card-h);display:flex;flex-direction:column;}
/* the end screen takes the same height as a card plus the choices */
#ww-end{min-height:calc(var(--card-h) + var(--gap) + var(--opts-h));}
#ww-game{position:relative;}
.ww-end-card .ww-body{padding-top:10px;}
.ww-score{margin:0;font-size:22px;line-height:1.1;font-weight:600;font-variant-numeric:lining-nums;}
.ww-score small{font-size:1em;font-weight:400;color:var(--muted);margin-left:6px;}
.ww-line{margin:6px 0 0;font-size:19.5px;line-height:1.25;}
@media (min-width:600px){ .ww-score{font-size:28px;} .ww-line{font-size:24px;} }

@media (prefers-reduced-motion:reduce){
  .ww-inner,.ww-opt{transition:none !important;}
  .ww-card.deal .ww-front{animation:none;}
}
</style>
</head>
<body>
<main class="ww" id="ww">
  <h2 class="ww-title" id="ww-head"><span class="t" id="ww-title"></span> <span id="ww-dek"></span></h2>

  <section id="ww-game" aria-labelledby="ww-head">
    <div class="ww-card" id="ww-card">
      <div class="ww-inner">
        <div class="ww-face ww-front" id="ww-front">
          <div class="ww-meta"><span id="ww-count"></span><span id="ww-tally"></span></div>
          <div class="ww-body"><p class="ww-story" id="ww-story"></p></div>
        </div>
        <div class="ww-face ww-back" id="ww-back" aria-hidden="true">
          <div class="ww-meta"><span class="ww-verdict" id="ww-verdict"></span><span id="ww-count-b"></span></div>
          <div class="ww-body">
            <p class="ww-ans" id="ww-ans"></p>
            <p class="ww-detail" id="ww-detail"></p>
            <p class="ww-worth" id="ww-worth" aria-hidden="true"></p>
            <p class="ww-reveal" id="ww-reveal"></p>
          </div>
        </div>
      </div>
    </div>
    <ul class="ww-opts" id="ww-opts" aria-labelledby="ww-story"></ul>
    <p class="sr" id="ww-live" aria-live="polite"></p>
  </section>

  <section id="ww-end" hidden aria-live="polite">
    <div class="ww-end-card">
      <div class="ww-meta"><span>Final score</span></div>
      <div class="ww-body">
        <p class="ww-score" id="ww-score"></p>
        <p class="ww-line" id="ww-line"></p>
      </div>
    </div>
    <button type="button" class="ww-btn ghost" id="ww-again">Play again</button>
  </section>
</main>

<script>
/* =====================================================================
   CARDS — the only part you need to edit.
   story:   the anecdote, written as a question.
   options: four choices (people or companies). Shown in a random order.
   answer:  must match one of the options exactly.
   answerShown: optional, what the answer side shows if it differs from the choice
            (e.g. the full name when the choices hide a middle name).
   kind:    "person" (shows a face or initials) or "business" (name only).
   detail:  short line under the answer, e.g. the rank.
   worth:   net worth in C$ billions. It counts up from $0 on the answer side
            while the reader waits for the next card.
   reveal:  one or two sentences shown when the card flips.
   PHOTOS:  optional square headshots, keyed by the exact name used in options.
   Cards are written from the 2026 profiles; names match the list exactly.
   ===================================================================== */
const GAME = {
  title: "BigShot",
  dek: "Match the fortune to the story.",
  cards: [
    { kind:"person",
      story:"Who started his company with a $25,000 mortgage on his home and now lives in Dubai?",
      options:["Stephan Crétier", "Philip Fayer", "Alain Bédard", "Serge Godin"],
      answer:"Stephan Crétier", detail:"No. 12 on the list", worth:3.8,
      reveal:"He founded GardaWorld in 1995. It’s now the world’s largest privately owned security company." },
    { kind:"business",
      story:"Which Quebec financial conglomerate has seen its share price roughly double since early 2025?",
      options:["Power Corporation", "Québecor", "CGI", "TFI International"],
      answer:"Power Corporation", detail:"Desmarais family · No. 1", worth:11.5,
      reveal:"It’s behind Great-West Lifeco, Canada Life and IGM Financial." },
    { kind:"person",
      story:"Who changed his middle name from “Carl” to “Karl” as a student, after Karl Marx?",
      options:["Pierre ____ Péladeau", "Serge ____ Godin", "Lawrence ____ Stroll", "Guy ____ Laliberté"],
      answer:"Pierre ____ Péladeau", answerShown:"Pierre Karl Péladeau", detail:"No. 11 on the list", worth:4.7,
      reveal:"He leads Québecor, owner of Vidéotron, Freedom Mobile, the Journal de Montréal and TVA." },
    { kind:"person",
      story:"Which former street performer travelled to space in 2009?",
      options:["Guy Laliberté", "Ryan Cohen", "John MacBain", "Andrew Lutfy"],
      answer:"Guy Laliberté", detail:"No. 21 on the list", worth:1.4,
      reveal:"He co-founded Cirque du Soleil in 1984 and founded the One Drop Foundation." },
    { kind:"person",
      story:"Whose family business was founded in Montreal in 1786, more than 80 years before Confederation?",
      options:["Molson brothers", "Kruger family", "Desmarais family", "Coutu family"],
      answer:"Molson brothers", detail:"No. 14 on the list", worth:3.2,
      reveal:"John Molson founded his brewery in 1786. The brothers now control Groupe CH, owner of the Canadiens." },
    { kind:"person",
      story:"Who led GameStop’s rejected bid of about US$56 billion for eBay this year?",
      options:["Ryan Cohen", "Philip Fayer", "Andrew Lutfy", "Lawrence Stroll"],
      answer:"Ryan Cohen", detail:"No. 7 on the list", worth:5.7,
      reveal:"The Montreal-born CEO co-founded Chewy and sold it to PetSmart in 2017." },
    { kind:"business",
      story:"Which Quebec company agreed in August to buy Poland’s Żabka for US$8.6 billion?",
      options:["Alimentation Couche-Tard", "Saputo Inc.", "Dollarama", "Groupe Dynamite"],
      answer:"Alimentation Couche-Tard", detail:"Alain Bouchard and family · No. 3", worth:10.5,
      reveal:"It came after Couche-Tard abandoned its bid for 7-Eleven’s Japanese owner in 2025." },
    { kind:"person",
      story:"Who married the snowmobile inventor’s daughter and built the company into a global giant?",
      options:["Laurent Beaudoin", "Pierre Beaudoin", "Paul Desmarais Jr.", "Lino Saputo Jr."],
      answer:"Laurent Beaudoin", detail:"Bombardier-Beaudoin families · No. 5", worth:6,
      reveal:"He married Joseph-Armand Bombardier’s daughter, Claire. His son Pierre now chairs Bombardier." },
    { kind:"person",
      story:"Which Montreal-born billionaire bought the Force India Formula One team in 2018?",
      options:["Lawrence Stroll", "Ryan Cohen", "Philip Fayer", "Andrew Lutfy"],
      answer:"Lawrence Stroll", detail:"No. 9 on the list", worth:5.1,
      reveal:"He made his fortune backing Tommy Hilfiger and Michael Kors, and renamed the team Aston Martin." },
    { kind:"person",
      story:"Who is the only newcomer on this year’s list?",
      options:["Alain Bédard", "Pierre Lassonde", "Réal Plourde", "John MacBain"],
      answer:"Alain Bédard", detail:"New at No. 24", worth:1.1,
      reveal:"He has run TFI International since 1996, building one of North America’s largest transportation companies." },
  ],
  // After an answer, the next card comes up by itself.
  nextSeconds: 3,          // seconds from answering to the next card
  countSeconds: 1.5,       // seconds from answering until the fortune finishes counting
  // Final line, by share of cards right (checked from the top).
  verdicts: [
    { min:1,   text:"A true know-it-all." },
    { min:.75, text:"Almost a know-it-all." },
    { min:.4,  text:"You know some of it." },
    { min:0,   text:"Time to read the profiles." },
  ],
};
const PHOTOS = {
  // The list’s headshots (same folder as this page), keyed by the exact choice text.
  "Stephan Crétier": "17.png",
  "Philip Fayer": "25.png",
  "Alain Bédard": "30.png",
  "Serge Godin": "21.png",
  "Pierre ____ Péladeau": "16.png",
  "Serge ____ Godin": "21.png",
  "Lawrence ____ Stroll": "14.png",
  "Guy ____ Laliberté": "27.png",
  "Guy Laliberté": "27.png",
  "Ryan Cohen": "12.png",
  "John MacBain": "31.png",
  "Andrew Lutfy": "11.png",
  "Lawrence Stroll": "14.png",
  "Pierre Lassonde": "29.png",
  "Réal Plourde": "24.png",
  "Molson brothers": "19.png",
  "Kruger family": "23.png",
  "Desmarais family": "1.png",
  "Coutu family": "18.png",
  // Snowmobile card: initials until we know which family photo is which person.
  // "Laurent Beaudoin": "9.png", "Pierre Beaudoin": "10.png",
  // "Paul Desmarais Jr.": "1.png", "Lino Saputo Jr.": "7.png",
};

/* =====================================================================
   Game
   ===================================================================== */
(function(){
  const $ = (id) => document.getElementById(id);
  const root = document.documentElement;
  const theme = new URLSearchParams(location.search).get("theme");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
  const initials = (name) => {
    name = name.replace(/\s+and (his |her )?family$/i, "")           // "Alain Bouchard and family" -> AB
               .replace(/\s+(Jr|Sr)\.?$/i, "");                          // "Lino Saputo Jr." -> LS
    const words = name.replace(/,/g, "").split(/\s+/).filter(w => /^[A-Za-zÀ-ÿ]/.test(w));
    const L = (w) => w[0].toUpperCase();
    if (/\b(family|families|sisters|brothers)$/i.test(name)) return L(words[0]);
    if (words.length === 3 && words.every(w => /^[A-ZÀ-Ý]/.test(w))) return words.map(L).join("");
    return words.length > 1 ? L(words[0]) + L(words[words.length - 1]) : L(words[0]);
  };
  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  const cards = GAME.cards.filter(c => {
    if (!c.options.includes(c.answer)) { console.warn("BigShot: answer not among the options:", c.answer); return false; }
    return true;
  });
  const N = cards.length;
  const fullDollars = (b) => "$" + Math.floor(b * 1e9).toLocaleString("en-CA");      // 3.8 -> $3,800,000,000
  const spoken = (b) => "$" + (Math.round(b * 10) / 10) + " billion";
  let countRaf = null;

  $("ww-title").textContent = GAME.title + ":";
  $("ww-dek").textContent = GAME.dek;

  const card = $("ww-card"), front = $("ww-front"), back = $("ww-back");
  const optsEl = $("ww-opts"), live = $("ww-live");
  let at = 0, score = 0, answered = false, timer = null;

  function deal(){
    const c = cards[at];
    answered = false;
    // turn the card face up again without animating, then deal the new one in
    card.querySelector(".ww-inner").style.transition = "none";
    card.classList.remove("flipped");
    card.getBoundingClientRect();
    card.querySelector(".ww-inner").style.transition = "";
    back.setAttribute("aria-hidden", "true"); front.removeAttribute("aria-hidden");
    card.classList.remove("deal"); void card.offsetWidth; card.classList.add("deal");

    $("ww-story").textContent = c.story;
    // fetch the next card's photos now, so its circles are ready when it's dealt
    const nx = cards[at + 1];
    if (nx) nx.options.forEach(o => { if (PHOTOS[o]) { const im = new Image(); im.src = PHOTOS[o]; } });
    // The answer side is filled now (hidden), so the card is already full height
    // and nothing below it moves when it flips.
    $("ww-verdict").className = "ww-verdict";
    $("ww-verdict").innerHTML = `<span class="ic" aria-hidden="true">✓</span>Right`;
    $("ww-ans").textContent = c.answerShown || c.answer;
    $("ww-detail").textContent = c.detail || "";
    $("ww-detail").hidden = !c.detail;
    $("ww-worth").textContent = c.worth ? fullDollars(c.worth) : "";
    $("ww-worth").hidden = !c.worth;
    $("ww-reveal").textContent = c.reveal || "";
    $("ww-reveal").hidden = !c.reveal;
    $("ww-count").textContent = `${at + 1} of ${N}`;
    $("ww-count-b").textContent = `${at + 1} of ${N}`;
    $("ww-tally").textContent = `${score} right`;

    optsEl.classList.remove("done");
    optsEl.innerHTML = shuffle(c.options).map(o => {
      const pic = c.kind === "business" ? "" :
        `<span class="ww-pic${PHOTOS[o] ? " has-img" : ""}" aria-hidden="true">${PHOTOS[o] ? `<img src="${esc(PHOTOS[o])}" alt="" decoding="async">` : esc(initials(o))}</span>`;
      return `<li><button type="button" class="ww-opt${c.kind === "business" ? " biz" : ""}" data-o="${esc(o)}">${pic}<span class="nm">${esc(o)}</span><span class="mk" aria-hidden="true"></span></button></li>`;
    }).join("");
  }

  function choose(btn){
    if (answered) return;
    answered = true;
    const c = cards[at], pick = btn.dataset.o, right = pick === c.answer;
    if (right) score++;

    optsEl.classList.add("done");
    optsEl.querySelectorAll(".ww-opt").forEach(b => {
      b.disabled = true;
      if (b.dataset.o === c.answer) { b.classList.add("right"); b.querySelector(".mk").textContent = "✓"; }
      else if (b === btn) { b.classList.add("wrong"); b.querySelector(".mk").textContent = "✕"; }
    });

    $("ww-verdict").className = "ww-verdict " + (right ? "is-right" : "is-wrong");
    $("ww-verdict").innerHTML = right
      ? `<span class="ic" aria-hidden="true">✓</span>Right`
      : `<span class="ic" aria-hidden="true">✕</span>Not quite`;
    $("ww-tally").textContent = `${score} right`;

    const ms = Math.round((GAME.nextSeconds || 1) * 1000);   // includes the flip
    countUp(c, ms);
    card.classList.add("flipped");
    front.setAttribute("aria-hidden", "true"); back.removeAttribute("aria-hidden");
    live.textContent = `${right ? "Right." : "Not quite."} It was ${c.answerShown || c.answer}. ${c.detail || ""}${c.worth ? ", worth " + spoken(c.worth) : ""}. ${c.reveal || ""}`;
    clearTimeout(timer);
    timer = setTimeout(advance, ms);
  }

  // The fortune runs up from $0 and lands just before the next card is dealt.
  function countUp(c, ms){
    cancelAnimationFrame(countRaf);
    const el = $("ww-worth");
    if (!c.worth) return;
    const target = c.worth * 1e9;
    if (reduceMotion) { el.textContent = fullDollars(c.worth); return; }
    const start = performance.now() + 150;                     // as the card turns
    const landAt = Math.min(ms - 100, (GAME.countSeconds || 1.9) * 1000);
    const dur = Math.max(300, landAt - 150);                   // land, then hold until the next card
    const ease = (t) => 1 - Math.pow(1 - t, 3);
    el.textContent = "$0";
    const step = (now) => {
      const t = Math.min(1, Math.max(0, (now - start) / dur));
      el.textContent = t < 1 ? "$" + Math.floor(target * ease(t)).toLocaleString("en-CA") : fullDollars(c.worth);
      if (t < 1) countRaf = requestAnimationFrame(step);
    };
    countRaf = requestAnimationFrame(step);
  }

  // Next card (or the score), on the timer or straight away if the reader taps the answer side.
  function advance(){
    if (!answered) return;
    clearTimeout(timer); timer = null; cancelAnimationFrame(countRaf);
    const hadFocus = $("ww-game").contains(document.activeElement);
    at++;
    if (at < N) {
      deal();
      live.textContent = `Card ${at + 1} of ${N}. ${cards[at].story}`;
      if (hadFocus) { try { optsEl.querySelector(".ww-opt").focus({ preventScroll:true }); } catch (e) {} }
    } else end();
  }

  function end(){
    answered = false;
    $("ww-game").hidden = true;
    $("ww-end").hidden = false;
    const share = N ? score / N : 0;
    $("ww-score").innerHTML = `${score}<small>of ${N}</small>`;
    $("ww-line").textContent = (GAME.verdicts.find(v => share >= v.min) || { text:"" }).text;
    try { $("ww-again").focus({ preventScroll:true }); } catch (e) {}
  }

  optsEl.addEventListener("click", (e) => { const b = e.target.closest(".ww-opt"); if (b) choose(b); });
  optsEl.addEventListener("error", (e) => {
    const img = e.target; if (!img || img.tagName !== "IMG") return;
    const pic = img.closest(".ww-pic"), btn = img.closest(".ww-opt");
    if (pic && btn) { pic.classList.remove("has-img"); pic.textContent = initials(btn.dataset.o); }
  }, true);
  back.addEventListener("click", advance);
  document.addEventListener("keydown", (e) => {
    if (answered && (e.key === "Enter" || e.key === " " || e.key === "ArrowRight")) { e.preventDefault(); advance(); }
  });
  $("ww-again").addEventListener("click", () => {
    clearTimeout(timer); at = 0; score = 0;
    $("ww-end").hidden = true; $("ww-game").hidden = false;
    deal(); fitCard();
    try { optsEl.querySelector(".ww-opt").focus({ preventScroll:true }); } catch (e) {}
  });

  // Every card gets the height of the tallest one at this width, so the embed never
  // changes height between cards. Never less than the --card-h set in the styles.
  const baseCardH = parseFloat(getComputedStyle($("ww")).getPropertyValue("--card-h")) || 266;
  function fitCard(){
    if ($("ww-game").hidden) return;
    const probe = card.cloneNode(true);
    probe.querySelectorAll("[id]").forEach(e => e.removeAttribute("id"));
    probe.classList.remove("flipped", "deal");
    probe.setAttribute("aria-hidden", "true");
    probe.style.cssText = "position:absolute;left:0;right:0;top:0;visibility:hidden;pointer-events:none;";
    probe.querySelectorAll(".ww-face").forEach(f => f.style.minHeight = "0");
    $("ww-game").appendChild(probe);
    const q = (sel) => probe.querySelector(sel);
    let need = 0;
    cards.forEach(c => {
      q(".ww-story").textContent = c.story;
      q(".ww-ans").textContent = c.answerShown || c.answer;
      q(".ww-detail").textContent = c.detail || ""; q(".ww-detail").hidden = !c.detail;
      q(".ww-worth").textContent = c.worth ? fullDollars(c.worth) : ""; q(".ww-worth").hidden = !c.worth;
      q(".ww-reveal").textContent = c.reveal || ""; q(".ww-reveal").hidden = !c.reveal;
      need = Math.max(need, q(".ww-front").offsetHeight, q(".ww-back").offsetHeight);
    });
    probe.remove();
    const h = Math.max(baseCardH, Math.ceil(need));
    $("ww").style.setProperty("--card-h", h + "px");
    if (h > baseCardH) console.info(`BigShot: the longest card needs ${h}px at this width, so the embed is ${h - baseCardH}px taller than usual.`);
  }
  let lastW = 0;
  new ResizeObserver(() => { const w = $("ww").clientWidth; if (w !== lastW) { lastW = w; fitCard(); } }).observe($("ww"));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitCard);

  if (N) { deal(); fitCard(); } else $("ww-game").hidden = true;

  // Tell the host page our height so the iframe never needs its own scrollbar.
  let lastH = 0;
  function postHeight(){
    const h = Math.ceil(document.documentElement.getBoundingClientRect().height);
    if (h !== lastH && window.parent !== window) {
      lastH = h;
      window.parent.postMessage({ type:"richlist:game-height", height:h }, "*");
    }
  }
  new ResizeObserver(postHeight).observe(document.documentElement);
  window.addEventListener("load", postHeight);
})();
</script>
</body>
</html>
